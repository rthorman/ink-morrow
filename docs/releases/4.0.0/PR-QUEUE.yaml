schema_version: 2
release: "4.0.0-beta.1"
decision_status: accepted
decision_date: "2026-08-31"
current_release_at_planning: "3.2.2"
documentation_snapshot: release-root
integration_branch: release/4.0.0
final_target: main

project_license:
  spdx_expression: AGPL-3.0-only
  license_file: LICENSE
  license_sha256: d8a6cc31abc16b6748c7a21f21611f5a1ec33f67d22ca23d7da1c19b95496bee
  applies_to: 4.0_release_line_and_generated_distributions
  allow_mit_project_metadata: false
  preserve_third_party_license_metadata: true
  modified_network_corresponding_source_offer: required

automation_policy:
  generated_4_0_project_license: AGPL-3.0-only
  allow_mit_licensed_4_0_output: false
  allow_project_license_downgrade: false
  require_license_notice_in_generated_output: true

history_policy:
  release_line:
    branch: release/4.0.0
    topology: parentless_root
    prohibited_ancestors:
      - main
    merge_from_main: forbidden
    rebase_onto_main: forbidden
  implementation_branches:
    fork_from: release/4.0.0
    target: release/4.0.0
  historical_main:
    through_version: "3.2.2"
    spdx_expression: MIT
    mutate: false
    hosting_commitment: none
  final_cutover:
    target: main
    method: reviewed_unrelated_history_cutover
    required_tree: exact_release_tip
    release_branch_mutation: forbidden

authority:
  product: WORKSHOP-DECISIONS.md
  round_table: ROUND-TABLE.md
  architecture: SYSTEM-ARCHITECTURE.md
  security: SECURITY-THREAT-MODEL.md
  ux: UX-ARCHITECTURE.md
  art: ART-DIRECTION.md
  quality: QA-RELEASE-GATES.md
  details: IMPLEMENTATION-PLAN.md

global_invariants:
  - 4.0 project-owned material remains AGPL-3.0-only
  - automation never emits a MIT-licensed 4.0 project variant
  - release/4.0.0 never gains main ancestry
  - third-party license notices and metadata remain intact
  - one canonical linear timeline
  - only the active tail is substantively editable
  - historical copyediting changes display prose without recalculating state
  - a prepared page is speculative and contributes no continuity
  - Next Page promotes the exact prepared prose
  - one deliberate action cannot duplicate canon or provider spend
  - art is noncanonical and never changes narrative state implicitly
  - uploaded images receive technical validation but no semantic moderation
  - reusable templates become story-local snapshots
  - shares are immutable read-only publication snapshots
  - provider credentials never enter exports, logs, snapshots, or frontend persistence
  - no 3.x database or archive migration

pull_requests:
  - id: "00"
    slug: plan-legal
    title: Planning, legal, and release contract
    status: merged
    target: main
    depends_on: []
    risk: low
    domains:
      - product
      - architecture
      - security
      - ux
      - legal
      - qa
    deliverables:
      - accepted workshop and round-table record
      - implementation plan and machine-readable queue
      - architecture, security, UX, art, and QA contracts
      - legal and privacy notices
      - repository documentation pointers
    acceptance:
      - internal links resolve
      - this YAML parses and matches IMPLEMENTATION-PLAN.md
      - shipped and planned behavior are clearly distinguished
      - historical main through 3.2.2 remains unchanged under MIT
      - the 4.0 release root and generated output are AGPL-3.0-only

  - id: "01"
    slug: v4-kernel
    title: Clean 4.0 kernel and schema identity
    status: merged
    target: release/4.0.0
    depends_on:
      - "00"
    risk: high
    domains:
      - backend
      - database
      - transfer
      - security
    deliverables:
      - explicit scribetribe-4 schema family and migrations
      - 3.x database refusal before mutation
      - archive v2 identity and manifest scaffold
      - operation journal and boot reconciliation
    acceptance:
      - clean and repeated boots are valid
      - 3.x and future fixtures fail closed
      - migrations are transactional
      - existing auth boundary remains fail closed

  - id: "02"
    slug: manuscript-hierarchy
    title: Volume, chapter, and page hierarchy
    status: merged
    target: release/4.0.0
    depends_on:
      - "01"
    risk: high
    domains:
      - backend
      - database
      - transfer
    deliverables:
      - story-volume-chapter-page data model
      - default Volume I and Chapter I
      - stable identities and transactional scoped order
      - hierarchy APIs and archive aggregates
    acceptance:
      - order is deterministic under concurrent inserts
      - renames preserve page identity
      - active-tail and neighbor queries are indexed
      - scenes are not entities

  - id: "03"
    slug: revisions-recovery
    title: Revisions, copyediting, and truncation recovery
    status: merged
    target: release/4.0.0
    depends_on:
      - "02"
    risk: very_high
    domains:
      - backend
      - database
      - transfer
    deliverables:
      - immutable page revisions
      - canonical and display revision pointers
      - tail editing and historical copyediting
      - truncation, immediate undo, and expiring recovery suffixes
    acceptance:
      - tail edit updates canonical and display text
      - copyedit changes display text only
      - truncate and restore are atomic
      - unsafe restore refuses rather than merges

  - id: "04"
    slug: providers-vault
    title: Provider profiles, secret vault, and AI roles
    status: merged
    target: release/4.0.0
    depends_on:
      - "03"
    risk: very_high
    domains:
