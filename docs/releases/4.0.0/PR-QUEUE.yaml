      - providers
      - backend
      - security
      - settings
    deliverables:
      - OpenAI-compatible provider profiles
      - Scribe, Archivist, and Narrator assignments
      - environment and session-only credentials
      - reviewed encrypted persistent vault or disabled persistence
    acceptance:
      - APIs never return secrets
      - canaries are absent from logs, archives, snapshots, and browser storage
      - password change rewraps saved secrets
      - restart requires passphrase re-entry before saved-secret use
      - terminal password recovery clears unrecoverable saved secrets but preserves manuscripts
      - manual work requires no provider

  - id: "05"
    slug: continuity-v2
    title: Continuity ledger v2
    status: merged
    target: release/4.0.0
    depends_on:
