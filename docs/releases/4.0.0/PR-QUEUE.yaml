release_blockers:
  - manuscript or continuity loss or corruption
  - speculative prose entering canon or state
  - wrong prepared prose committed
  - duplicate provider work from one action
  - stale response mutating another context
  - credential, session, private prose, recovery, or capability disclosure
  - upload invoking AI or semantic moderation without consent
  - active or malformed upload escaping the media boundary
  - mutable or private public-share access
  - failed same-version project round trip
  - invalid core publication formats
  - broken desktop or portrait-tablet authoring loop
  - authentication bypass or known critical or high supported-path vulnerability
