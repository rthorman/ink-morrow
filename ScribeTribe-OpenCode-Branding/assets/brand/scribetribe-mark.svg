<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ScribeTribe mark</title>
  <desc id="desc">An elegant quill nib framed by feline ears above an open manuscript.</desc>
  <defs>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F2949"/>
      <stop offset="1" stop-color="#4B1028"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D69A"/>
      <stop offset="0.5" stop-color="#C7A35B"/>
      <stop offset="1" stop-color="#806333"/>
    </linearGradient>
  </defs>

  <!-- Open feline crown: intentionally unshielded and light in silhouette. -->
  <path d="M42 117C45 84 52 54 66 29l39 39c8-3 15-4 23-4s15 1 23 4l39-39c14 25 21 55 24 88"
        fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M63 92 70 53l25 27M193 92l-7-39-25 27"
        fill="none" stroke="#6E1834" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quill-nib flame: writing remains the central gesture. -->
  <path d="M128 65c22 24 31 49 25 73-4 18-14 34-25 51-11-17-21-33-25-51-6-24 3-49 25-73Z"
        fill="url(#gold)" stroke="#E7CF9A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 85v83M113 126l15 18 15-18" fill="none" stroke="#100A16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="171" r="4.5" fill="#69D9CB"/>

  <!-- Open manuscript, with a quiet central gutter and lifting page tips. -->
  <path d="M28 151c38-9 70-2 100 24 30-26 62-33 100-24l-13 66c-34-7-63 0-87 20-24-20-53-27-87-20L28 151Z"
        fill="url(#book)" stroke="#E0C584" stroke-width="7" stroke-linejoin="round"/>
  <path d="M128 175v62M42 166c31-5 58 2 82 22M214 166c-31-5-58 2-82 22"
        fill="none" stroke="#C7A35B" stroke-width="4" stroke-linecap="round"/>
</svg>
