<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Shared reading copy · ScribeTribe</title>
  <link rel="stylesheet" href="/styles/share-viewer.css">
</head>
<body>
  <header class="share-masthead">
    <a href="#readingCopy" class="skip-link">Skip to reading copy</a>
    <span class="share-mark" aria-hidden="true">ST</span>
    <div>
      <strong>ScribeTribe reading copy</strong>
      <span>Immutable · read only</span>
    </div>
  </header>
  <main id="readingCopy" class="share-reader" tabindex="-1">
    <p id="shareStatus" class="share-status" role="status" aria-live="polite">Opening the reading copy…</p>
    <article id="shareDocument" hidden></article>
  </main>
  <footer>This link exposes only the reviewed publication snapshot. It cannot open the private writing workspace.</footer>
  <script type="module" src="/app/public-share.js"></script>
</body>
</html>
